<body>

<div class="container">
    <h1>JavaScript 物件操作結果</h1>
    
    <h2>1. 原始物件的所有屬性 (Properties)</h2>
    <p>使用 <code class="highlight">Object.keys()</code> 取得的屬性列表：</p>
    <pre id="properties-list"></pre>

    <h2>2. 刪除 age 屬性並印出新物件</h2>
    <p>使用 <code class="highlight">delete Person.age</code> 後的物件內容：</p>
    <pre id="object-result"></pre>
</div>

<script>
    // 1. 定義題目提供的 Sample object
    var Person = {
        firstName : "Tony",
        lastName  : "Lee",
        age       : 50,
        eyeColor  : "Blue"
    };

    // 2. 列出該物件的所有屬性
    // Object.keys() 會回傳一個包含所有 key 的陣列
    var allProperties = Object.keys(Person);
    
    // 將屬性列表顯示在網頁上 (用逗號隔開)
    document.getElementById("properties-list").textContent = allProperties.join(", ");

    // 3. 刪除 age 屬性
    delete Person.age;

    // 4. 印出刪除後的物件
    // JSON.stringify(Person, null, 2) 可以把物件轉成美化排版後的 JSON 字串
    document.getElementById("object-result").textContent = JSON.stringify(Person, null, 2);
</script>

</body>
