<!DOCTYPE html>
<html>
<head>
  <title>Circle Calculator</title>
</head>
<body>
  <h2>Circle Calculator</h2>

  <label>Radius: <input type="number" id="radius" value="5"></label>
  <br><br>
  <button onclick="calcCircumfrence()">Calc Circumference</button>
  <button onclick="calcArea()">Calc Area</button>
  <br><br>
  <p id="output"></p>

  <script>
    function calcCircumfrence() {
      var radius = document.getElementById("radius").value;
      var circumference = 2 * Math.PI * radius;
      document.getElementById("output").innerText = "The circumference is " + circumference.toFixed(2);
    }

    function calcArea() {
      var radius = document.getElementById("radius").value;
      var area = Math.PI * radius * radius;
      document.getElementById("output").innerText = "The area is " + area.toFixed(2);
    }
  </script>
</body>
</html>
